version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cloudvault-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cloudvault-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cloudvault-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - cloudvault-net

  postgres:
    image: postgres:15-alpine
    container_name: cloudvault-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: cloudvault
      POSTGRES_PASSWORD: cloudvault_secret_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloudvault-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: cloudvault-auth-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: cloudvault
      SPRING_DATASOURCE_PASSWORD: cloudvault_secret_pass
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
      JWT_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000
    networks:
      - cloudvault-net

  vault-event-service:
    build:
      context: ./vault-event-service
      dockerfile: Dockerfile
    container_name: cloudvault-event-service
    ports:
      - "8082:8082"
    depends_on:
      - kafka
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLOUDVAULT_KAFKA_TOPICS_FILE_EVENTS: file-vault-events
      CLOUDVAULT_KAFKA_TOPICS_DLQ_EVENTS: file-vault-events.DLQ
    networks:
      - cloudvault-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: cloudvault-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - vault-event-service
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: auth-service-route
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://auth-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/v1/auth/**
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: vault-event-service-route
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://vault-event-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/v1/vault-events/**
    networks:
      - cloudvault-net

networks:
  cloudvault-net:
    driver: bridge

volumes:
  postgres_data:
